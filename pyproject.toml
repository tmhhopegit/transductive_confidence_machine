[project]
name = "tcm"
version = "1.0.0"
description = "Transductive confidence machine (k-NN) for two-class patient data, with feature-weight search and patient selection"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tcm"]
